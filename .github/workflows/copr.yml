name: Copr

# A release tag is built in the Copr project sachesi/software once its GitHub release is
# published (ci.yml calls this). Run by hand, it builds the given tag again.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, such as v0.1.0
        required: true

permissions:
  contents: read

jobs:
  copr:
    name: Build in Copr
    runs-on: ubuntu-latest
    # Listed with the repository's deployments, linking to the package in Copr.
    environment:
      name: copr
      url: https://copr.fedorainfracloud.org/coprs/sachesi/software/package/machines/
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Start the build
        env:
          # The custom webhook of sachesi/software, without the package name.
          COPR_WEBHOOK: ${{ secrets.COPR_WEBHOOK }}
        run: |
          [ -n "$COPR_WEBHOOK" ] || { echo "COPR_WEBHOOK is not set" >&2; exit 1; }
          # Copr's script for the package builds the tag it is sent, with the spec on main.
          curl -fsS -X POST --data "$TAG" "${COPR_WEBHOOK%/}/machines/"
